<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vir2ose-Radio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    
    <!-- iOS / Apple PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="vir2oseRadio">
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
    <!-- Favicon für Desktop Browser -->
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
</head>
<body>

    <div id="app-viewport">
        <!-- 1. Background Layer -->
        <picture>
            <source media="(max-aspect-ratio: 1/1)" srcset="Assets Smartphone/background_smartphone.png">
            <img class="layer" src="Assets/background.png" alt="Background" draggable="false">
        </picture>
        
        <!-- 2. Menu Layer -->
        <picture>
            <source media="(max-aspect-ratio: 1/1)" srcset="Assets Smartphone/buttons_smartphone.png">
            <img class="layer" src="Assets/menü_about.png" alt="Menu" draggable="false">
        </picture>
        
        <!-- 3. Controls Layer (Inactive) -->
        <picture>
            <source media="(max-aspect-ratio: 1/1)" srcset="Assets Smartphone/bedienelemente_smartphone.png">
            <img class="layer" id="layer-controls-inactive" src="Assets/bedienelemente_play_pause_stop_1.png" alt="Controls" draggable="false">
        </picture>
        
        <!-- 4. Controls Layer (Active / Glowing) -->
        <picture>
            <source media="(max-aspect-ratio: 1/1)" srcset="Assets Smartphone/bedienelemente_smartphone.png">
            <img class="layer hidden-layer" id="layer-controls-active" src="Assets/bedienelemente_play_pause_stop_2.png" alt="Controls Glowing" draggable="false">
        </picture>
        
        <!-- 5. Random Repeater Layer -->
        <picture>
            <source media="(max-aspect-ratio: 1/1)" srcset="Assets Smartphone/random_repeter_smartphone.png">
            <img class="layer" id="layer-random" src="Assets/random_repeter.png" alt="Random Repeater" draggable="false">
        </picture>
        
        <!-- Clock Container (Positioned exactly over the Photoshop template) -->
        <div id="clock-container">
            <div id="clock-day">SUNDAY</div>
            <div id="clock-date">23.08.2026</div>
            <div id="clock-time">18:30:00</div>
        </div>

        <!-- Invisible Hitboxes for Menus -->
        <button id="btn-artists" class="hitbox hitbox-artists" aria-label="Artists"></button>
        <button id="btn-genres" class="hitbox hitbox-genres" aria-label="Genres"></button>
        <button id="btn-about" class="hitbox hitbox-about" aria-label="About"></button>
        
        <!-- Invisible Hitboxes for Controls -->
        <button id="btnStop" class="hitbox hitbox-stop" aria-label="Stop"></button>
        <button id="btnPause" class="hitbox hitbox-pause" aria-label="Pause"></button>
        <button id="playBtn" class="hitbox hitbox-play" aria-label="Play"></button>
        <button id="btnRandom" class="hitbox hitbox-random" aria-label="Shuffle"></button>

        <!-- Modal Overlay für Menüs -->
        <div id="menu-modal" class="modal-overlay hidden">
            <div class="modal-content">
                <button id="close-modal" class="close-btn">&times;</button>
                <h3 id="modal-title" class="modal-title">Title</h3>
                <ul id="modal-list" class="modal-list">
                    <!-- Wird via JS befüllt -->
                </ul>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>

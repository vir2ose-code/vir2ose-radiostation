<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vir2ose-Radio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    
    <!-- iOS / Apple PWA Support -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="vir2oseRadio">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
</head>
<body>

    <!-- Goldene Überschrift (nur Desktop) -->
    <h2 class="gold-heading">The future of artist-driven radio.</h2>

    <!-- Top Menu für Artists und Genres -->
    <div class="top-menu">
        <button id="btn-artists" class="gold-btn" aria-label="Artist">ARTIST</button>
        <span class="separator">|</span>
        <button id="btn-genres" class="gold-btn" aria-label="Genres">GENRES</button>
    </div>

    <!-- Modal Overlay für Menüs -->
    <div id="menu-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <button id="close-modal" class="close-btn">&times;</button>
            <h3 id="modal-title" class="modal-title">Title</h3>
            <ul id="modal-list" class="modal-list">
                <!-- Wird via JS befüllt -->
            </ul>
        </div>
    </div>

    <!-- Full-Screen Control Deck über der gerenderten Grafik -->
    <div class="player-container">
        <div class="control-deck">
            <div id="date-widget" class="date-widget"></div>
            
            <button id="btnStop" class="hotspot" aria-label="Stop"></button>
            <button id="btnPause" class="hotspot" aria-label="Pause"></button>
            <button id="playBtn" class="hotspot hotspot-main-coin" aria-label="Play / Pause"></button>
            
            <div id="time-widget" class="time-widget"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
